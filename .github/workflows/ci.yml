name: 🧪 CI

on:
  pull_request:
    branches: [ develop, main ]

concurrency:
  group: '${{ github.workflow }}-${{ github.event.pull_request.head.label || github.ref }}'
  cancel-in-progress: true

jobs:
  android-build:
    name: Android Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GRADLE_OPTS: "-Xmx4g -Dkotlin.daemon.jvm.options=-Xmx3g"
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: ./.github/actions/setup-java
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug --stacktrace

  android-test:
    name: Android Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GRADLE_OPTS: "-Xmx4g -Dkotlin.daemon.jvm.options=-Xmx3g"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-java
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test --stacktrace
      - run: ./gradlew :cabitools-sdk-application:koverHtmlReport :cabitools-sdk-application:koverVerify --stacktrace
      - name: Upload Kover HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kover-html-report
          path: cabitools-sdk-application/build/reports/kover/html/

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GRADLE_OPTS: "-Xmx4g -Dkotlin.daemon.jvm.options=-Xmx3g"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-java
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew lint --stacktrace
      - name: Upload Lint HTML reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lint-html-reports
          path: '*/build/reports/lint-results-*.html'
      - run: ./gradlew detekt --stacktrace
      - name: Upload Detekt HTML reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: detekt-html-reports
          path: '*/build/reports/detekt/detekt.html'
      - name: Check :cabitools-sdk-application and :cabitools-sdk-application-no-op public APIs match
        run: ./gradlew checkNoOpApi --stacktrace
      - name: Upload public API dumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: no-op-api-dumps
          path: build/reports/noOpApi/

  finish:
    name: 🏁 Finish
    if: ${{ !cancelled() }}
    needs:
      - android-build
      - android-test
      - static-analysis
    runs-on: ubuntu-latest
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        name: Fail
        run: exit 1
